controller_manager:
  ros__parameters:
    update_rate: 1000  # QUAN TRỌNG: Tăng lên 1000Hz để điều khiển mượt mà (1ms)
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rnea_controller:
      type: rnea_control/rneacontroller
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
rnea_controller:
  ros__parameters:
    # 1. Danh sách khớp
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
    
    # 2. Hệ số PD (Stiffness - Damping)
    # Nếu robot bị rung, hãy giảm P. Nếu robot không tới đích, hãy tăng P.
    gains:
      joint_1: {p: 2000.0, d: 100.0}
      joint_2: {p: 1000.0, d: 50.0}
      joint_3: {p: 800.0,  d: 40.0}
      joint_4: {p: 500.0,  d: 20.0}
      joint_5: {p: 200.0,  d: 5.0}

    # 3. Thông số Động lực học & Hình học (DH)
    robot_description_parameters:
      
      # --- LINK 1 (Prismatic - Tịnh tiến) ---
      link1:
        type: "prismatic"
        mass: 0.83811
        com: [0.0, 0.0, 0.0]
        inertia: [0.00485, 0.0, 0.0, 0.0, 0.00485, 0.0, 0.0, 0.0, 0.00964]
        p: [0.0, 0.0, 0.006376]
        # DH Parameters [a, alpha, d_offset, theta_offset]
        # Với khớp tịnh tiến, biến khớp q sẽ cộng vào d.
        # Ở đây giả sử trục Z thẳng đứng, không xoay.
        dh_params: [0.0, 0.0, 0.0, 0.0] 
      
      # --- LINK 2 (Revolute - Vai) ---
      link2:
        type: "revolute"
        mass: 0.28679
        com: [0.0, 0.0, 0.03011]
        inertia: [0.00055, 0.0, 0.0, 0.0, 0.00063, 0.0, 0.0, 0.0, 0.00027]
        p: [0.0, 0.0, 0.05]
        # DH Parameters [a, alpha, d, theta_offset]
        # Dựa vào p=[0,0,0.05], ta có d=0.05.
        # Alpha -1.57 (-90 độ) thường dùng để chuyển từ trục Z đứng sang Z ngang.
        dh_params: [0.0, -1.5708, 0.05, 0.0] 

      # --- LINK 3 (Revolute - Khuỷu) ---
      link3:
        type: "revolute"
        mass: 0.4979
        com: [0.0853, 0.0, 0.0]
        inertia: [0.0004, 0.00008, 0.0, 0.00008, 0.00367, 0.0, 0.0, 0.0, 0.00345]
        p: [0.2, 0.0, 0.0]
        # Dựa vào p=[0.2, 0, 0], đây là độ dài link a=0.2.
        dh_params: [0.2, 0.0, 0.0, 0.0]

      # --- LINK 4 (Revolute - Cổ tay 1) ---
      link4:
        type: "revolute"
        mass: 0.42729
        com: [0.0853, 0.0, 0.0]
        inertia: [0.00015, 0.0, 0.0, 0.0, 0.00345, 0.0, 0.0, 0.0, 0.00342]
        p: [0.15, 0.0, 0.0]
        # Dựa vào p=[0.15, 0, 0], độ dài link a=0.15.
        dh_params: [0.15, 0.0, 0.0, 0.0]

      # --- LINK 5 (Revolute - Cổ tay 2/End Effector) ---
      link5:
        type: "revolute"
        mass: 0.05928
        com: [0.02218, 0.0, 0.0]
        inertia: [0.00001, 0.0, 0.0, 0.0, 0.00006, 0.0, 0.0, 0.0, 0.00006]
        p: [0.055, 0.0, 0.0]
        # Dựa vào p=[0.055, 0, 0], độ dài link a=0.055.
        dh_params: [0.055, 0.0, 0.0, 0.0]

gripper_controller:
  ros__parameters:
    joints:
      - joint_gripper1
      - joint_gripper2
    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity

    gains:
      joint_gripper1: {p: 100.0, i: 0.0, d: 1.0}
      joint_gripper2: {p: 100.0, i: 0.0, d: 1.0}